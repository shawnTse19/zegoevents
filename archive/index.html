async function restoreActivity(id) {
  const resp = await fetch('/api/restore', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id}) });

  if (result.ok) { alert('已恢复'); location.reload(); }
  else { alert('恢复失败'); }
}
